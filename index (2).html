<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>flores pra o GuiGui</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#070b1f; --sky2:#1d1545; --ink:#fff1f7; --glow:#ff7eb6;
  --stem:#2f9e5b; --stem2:#1b6b3d;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;margin:0}
body{
  overflow:hidden; color:var(--ink);
  background:radial-gradient(ellipse at 50% 110%,var(--sky2),var(--sky1) 70%);
  font-family:"Dancing Script","Segoe Script",cursive;
}
h1{
  position:absolute; left:0; right:0; top:11%; margin:0; padding:0 16px;
  text-align:center; font-weight:600; font-size:clamp(2.3rem,10vw,4.8rem);
  text-shadow:0 0 12px var(--glow),0 0 32px var(--glow);
  opacity:0; animation:fadeUp 2.2s .3s ease forwards; z-index:3;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.star{position:absolute;border-radius:50%;background:#fff;animation:tw 3s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.garden{position:absolute;left:0;right:0;bottom:0;height:62%;z-index:2}
.ground{position:absolute;left:-5%;right:-5%;bottom:-30px;height:70px;background:#0c1a1a;border-radius:50% 50% 0 0;z-index:4}
.flower{
  position:absolute; bottom:0; width:6px; margin-left:-3px; height:0;
  background:linear-gradient(var(--stem),var(--stem2)); border-radius:3px;
  animation:grow 3s var(--d) cubic-bezier(.3,.7,.3,1) forwards;
}
@keyframes grow{to{height:calc(var(--h) * 1svh)}}
.leaf{
  position:absolute; width:34px; height:18px; background:var(--stem); opacity:0;
  border-radius:0 100% 0 100%; animation:show 1s calc(var(--d) + 2s) forwards;
}
.leaf.l{left:-32px;bottom:22%;transform:scaleX(-1) rotate(-15deg)}
.leaf.r{left:5px;bottom:36%;transform:rotate(-15deg)}
@keyframes show{to{opacity:1}}
.head{
  position:absolute; left:50%; top:0; width:0; height:0;
  animation:sway 5s calc(var(--d) + 3.5s) ease-in-out infinite;
}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.petal{
  position:absolute; left:calc(var(--s) * var(--pw) * -.5); bottom:0;
  width:calc(var(--s) * var(--pw)); height:calc(var(--s) * .5);
  border-radius:50% 50% 50% 50% / 75% 75% 25% 25%;
  background:linear-gradient(hsl(var(--hue),var(--sat),var(--l1)),hsl(var(--hue),var(--sat),var(--l2)));
  box-shadow:0 0 12px hsla(var(--hue),var(--sat),70%,.55);
  transform-origin:50% 100%; transform:rotate(var(--a)) scale(0);
  animation:bloom 1.6s calc(var(--d) + 2.6s + var(--i) * .08s) cubic-bezier(.2,1.4,.4,1) forwards;
}
@keyframes bloom{to{transform:rotate(var(--a)) scale(1)}}
.core{
  position:absolute; width:calc(var(--s) * var(--cs)); height:calc(var(--s) * var(--cs));
  left:calc(var(--s) * var(--cs) * -.5); top:calc(var(--s) * var(--cs) * -.5); border-radius:50%;
  background:radial-gradient(var(--c1),var(--c2)); box-shadow:0 0 14px var(--c2);
  transform:scale(0); animation:bloom0 1s calc(var(--d) + 2.5s) forwards;
}
@keyframes bloom0{to{transform:scale(1)}}
.heart{position:absolute;bottom:-20px;color:#ff8fc3;opacity:0;animation:rise linear infinite;z-index:1}
@keyframes rise{0%{opacity:0;transform:translateY(0)}15%{opacity:.8}100%{opacity:0;transform:translateY(-95vh) translateX(20px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<h1>flores pra o GuiGui</h1>
<div class="garden" id="garden"></div>
<div class="ground"></div>
<script>
(function(){
  var rnd=function(a,b){return a+Math.random()*(b-a)};
  for(var i=0;i<70;i++){
    var s=document.createElement('div'); s.className='star';
    var z=rnd(1,2.6);
    s.style.cssText='left:'+rnd(0,100)+'%;top:'+rnd(0,60)+'%;width:'+z+'px;height:'+z+'px;animation-delay:'+rnd(0,3)+'s';
    document.body.appendChild(s);
  }
  for(var j=0;j<9;j++){
    var h=document.createElement('div'); h.className='heart'; h.textContent='\u2665';
    h.style.cssText='left:'+rnd(5,95)+'%;font-size:'+rnd(12,24)+'px;animation-duration:'+rnd(9,16)+'s;animation-delay:'+rnd(4,14)+'s';
    document.body.appendChild(h);
  }
  var T={
    rosa:{n:8,pw:.34,hue:330,sat:'90%',l1:'82%',l2:'58%',c1:'#fff3a8',c2:'#ffb300',cs:.26},
    girassol:{n:18,pw:.2,hue:46,sat:'100%',l1:'62%',l2:'48%',c1:'#8a5a2b',c2:'#3b2412',cs:.36},
    margarida:{n:12,pw:.2,hue:0,sat:'0%',l1:'100%',l2:'86%',c1:'#fff3a8',c2:'#ffb300',cs:.24},
    lilas:{n:6,pw:.4,hue:270,sat:'85%',l1:'80%',l2:'60%',c1:'#fff3a8',c2:'#ffb300',cs:.22},
    tulipa:{n:5,pw:.38,fan:70,hue:350,sat:'85%',l1:'72%',l2:'48%',c1:'#fff',c2:'#fff',cs:0},
    orquidea:{n:5,pw:.5,hue:300,sat:'70%',l1:'92%',l2:'68%',c1:'#ffffff',c2:'#c2188a',cs:.2}
  };
  var cfg=[
    {t:'girassol',x:6,h:36,s:104,d:.5},
    {t:'rosa',x:2,h:26,s:64,hue:340,d:1.3},
    {t:'tulipa',x:12,h:24,s:70,hue:350,d:1.2},
    {t:'rosa',x:18,h:30,s:72,hue:330,d:.9},
    {t:'orquidea',x:24,h:46,s:92,hue:300,d:.6},
    {t:'margarida',x:30,h:34,s:78,d:.2},
    {t:'tulipa',x:36,h:42,s:80,hue:330,d:.4},
    {t:'girassol',x:42,h:52,s:124,d:0},
    {t:'rosa',x:48,h:28,s:76,hue:350,d:.7},
    {t:'orquidea',x:54,h:40,s:88,hue:285,d:.35},
    {t:'tulipa',x:59,h:30,s:70,hue:20,d:1},
    {t:'lilas',x:64,h:44,s:84,d:.3},
    {t:'girassol',x:70,h:46,s:112,d:.1},
    {t:'margarida',x:76,h:28,s:72,d:.8},
    {t:'rosa',x:82,h:38,s:86,hue:315,d:.45},
    {t:'tulipa',x:87,h:26,s:68,hue:340,d:1.1},
    {t:'orquidea',x:92,h:34,s:80,hue:310,d:.75},
    {t:'margarida',x:97,h:42,s:72,d:.55}
  ];
  var g=document.getElementById('garden');
  cfg.forEach(function(c){
    var f=document.createElement('div'); f.className='flower';
    var t=T[c.t];
    f.style.cssText='left:'+c.x+'%;--h:'+c.h+';--d:'+c.d+'s;--s:min('+c.s+'px,20vw);--hue:'+(c.hue||t.hue)+
      ';--sat:'+t.sat+';--l1:'+t.l1+';--l2:'+t.l2+';--c1:'+t.c1+';--c2:'+t.c2+';--cs:'+t.cs+';--pw:'+t.pw;
    var html='<div class="leaf l"></div><div class="leaf r"></div><div class="head">';
    for(var i=0;i<t.n;i++) html+='<div class="petal" style="--a:'+(t.fan?(i/(t.n-1)-.5)*t.fan:i*360/t.n)+'deg;--i:'+i+'"></div>';
    html+='<div class="core"></div></div>';
    f.innerHTML=html; g.appendChild(f);
  });
})();
</script>
</body>
</html>
